[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ggufdiff"
version = "0.1.0"
description = "What actually changed between two GGUF files? Sizes, bits-per-weight, per-format and per-layer deltas, KV geometry, structural sanity. Headers only, stdlib-only."
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
ggufdiff = "ggufdiff:main"

[tool.setuptools]
py-modules = ["ggufdiff"]
